name: IndexNow ping
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow (Bing / Yandex)
        run: |
          cat > ping.py <<'PY'
          import json, re, urllib.request

          B = "https://examstatus.india-in.workers.dev"
          KEY = "0fdc8e2808c0ddf1713ff9bd0719710a"

          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": "indexnow-ping/1.0"})
              return urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")

          def locs(xml):
              return re.findall(r"<loc>([^<]+)</loc>", xml)

          urls = set()
          try:
              idx = get(B + "/sitemap-index.xml")
              for s in locs(idx)[:20]:
                  try:
                      for u in locs(get(s)):
                          urls.add(u.strip())
                  except Exception as e:
                      print("child sitemap fail:", s, e)
          except Exception as e:
              print("sitemap-index fail:", e)
          if not urls:
              urls = {B + "/"}
          urls = sorted(urls)[:200]
          print("urls_found:", len(urls))
          print("sample:", urls[:3])

          payload = {"host": "examstatus.india-in.workers.dev", "key": KEY,
                      "keyLocation": B + "/" + KEY + ".txt", "urlList": urls}
          data = json.dumps(payload).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=data,
              headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              r = urllib.request.urlopen(req, timeout=30)
              print("indexnow_status:", r.status)
          except urllib.error.HTTPError as e:
              print("indexnow_status:", e.code)
          PY
          python3 ping.py
