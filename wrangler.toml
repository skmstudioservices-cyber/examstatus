name = "examstatus"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist_worker.js/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "examstatus-db"
database_id = "5929f80d-1368-417a-9023-3154807b44f1"

[ai]
binding = "AI"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[triggers]
crons = ["0 */3 * * *"]

# Secrets (set via dashboard or `wrangler secret put`):
#   ADMIN_SESSION_SECRET — admin session signin
#   AI_CRON_SECRET — authorizes /api/cron/research and /api/cron/audit
# Optional var:
#   PUBLIC_SITE_URL — base URL for scheduled self-fetch (default: https://examstatus.india-in.workers.dev)
