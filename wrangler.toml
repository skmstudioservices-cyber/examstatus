name = "examstatus"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist/_worker.js/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "examstatus-db"
database_id = "5929f80d-1368-417a-9023-3154807b44f1"

[ai]
binding = "AI"

[observability]
enabled = true

[triggers]
crons = ["0 * * * *"]

# Secrets (set via dashboard or `wrangler secret put`):
#   ADMIN_SESSION_SECRET — admin session signing
#   AI_CRON_SECRET — authorizes /api/cron/research and /api/cron/audit
# Optional var:
#   PUBLIC_SITE_URL — base URL for scheduled self-fetch (default workers.dev)
