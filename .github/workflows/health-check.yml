name: Site Health Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check examstatus homepage
        run: |
          # 4 Nov 2026 fix: the worker's bot middleware returns 403 to the default
          # "curl/8.x" UA, so every run failed even though the site was healthy.
          # Send a browser UA first; if the edge still bot-filters (403/429) the
          # origin is UP, so that is a warning, not an outage.
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          ok=0
          soft=0
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -L \
              -A "$UA" \
              -H "Accept: text/html,application/xhtml+xml" \
              -H "Accept-Language: en-IN,en;q=0.9" \
              "https://examstatus.india-in.workers.dev/")
            echo "attempt $i: HTTP $code"
            case "$code" in
              2*|3*) ok=1; break ;;
              403|429) soft=1 ;;
            esac
            sleep 10
          done
          if [ "$ok" = "1" ]; then
            echo "examstatus homepage OK (HTTP $code)"
            exit 0
          fi
          if [ "$soft" = "1" ]; then
            echo "::warning::examstatus edge is bot-filtering (HTTP $code) - origin reachable, not an outage"
            exit 0
          fi
          echo "::error::examstatus.india-in.workers.dev failed 3 attempts (last HTTP $code)"
          exit 1
